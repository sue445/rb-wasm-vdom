name: npm publish

on:
  workflow_dispatch:
    inputs:
      version_type:
        description: "Argument for npm version"
        required: true
        default: "patch"
        type: choice
        options:
          - patch
          - minor
          - major
          - prerelease
          - prepatch
          - preminor
          - premajor

      preid:
        description: "Pre-release identifier. Used when version_type is prerelease, prepatch, preminor, or premajor"
        required: false
        default: "beta"
        type: choice
        options:
          - beta
          - rc
          - alpha

      npm_tag:
        description: "npm dist-tag"
        required: true
        default: "latest"
        type: choice
        options:
          - latest
          - beta
          - next

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    if: github.repository == 'sue445/rb-wasm-vdom'

    runs-on: ubuntu-latest

    concurrency: npm-publish

    environment:
      name: npmjs.com
      url: https://www.npmjs.com/package/@sue445/rb-wasm-vdom

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit

      - name: Validate release inputs
        run: |
          case "${VERSION_TYPE}:${NPM_TAG}" in
            prerelease:latest|prepatch:latest|preminor:latest|premajor:latest)
              echo "Pre-release version should not be published with npm dist-tag 'latest'."
              exit 1
              ;;
          esac
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          NPM_TAG: ${{ inputs.npm_tag }}

      - uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        id: app-token
        with:
          client-id: ${{ secrets.GH_APP_ID }}
          private-key: ${{ secrets.GH_APP_PRIVATE_KEY }}

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}

      - name: Setup Node.js
        uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6.4.0
        with:
          node-version-file: .tool-versions
          registry-url: https://registry.npmjs.org/
          cache: npm

      - name: Install latest npm
        run: npm install -g npm@latest

      - name: Show versions
        run: |
          node --version
          npm --version

      - name: Install dependencies
        run: npm ci

      - name: Get Playwright version
        id: playwright-version
        run: echo "version=$(node -p "require('./node_modules/@playwright/test/package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Cache Playwright browsers
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ steps.playwright-version.outputs.version }}

      - name: Install Playwright Browsers
        run: npx playwright install chromium

      - name: Run tests
        run: npm test

      - name: Get GitHub App User ID
        id: get-user-id
        run: echo "user-id=$(gh api "/users/${{ steps.app-token.outputs.app-slug }}[bot]" --jq .id)" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}

      # ref. https://zzzkan.me/blog/github-action-direct-push/
      - name: Prepare for git push by GitHub App
        run: |
          git config user.name ${GIT_USER_NAME}
          git config user.email ${GIT_USER_EMAIL}
        env:
          GIT_USER_NAME: "${{ steps.app-token.outputs.app-slug }}[bot]"
          GIT_USER_EMAIL: "${{ steps.get-user-id.outputs.user-id }}+${{ steps.app-token.outputs.app-slug }}[bot]@users.noreply.github.com"

      - name: Bump version
        run: |
          case "${VERSION_TYPE}" in
            prerelease|prepatch|preminor|premajor)
              npm version ${VERSION_TYPE} --preid=${PREID}
              ;;
            patch|minor|major)
              npm version ${VERSION_TYPE}
              ;;
          esac
        env:
          VERSION_TYPE: ${{ inputs.version_type }}
          PREID: ${{ inputs.preid }}

      - name: Get package version
        id: package_version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Push version commit and tag
        run: git push origin HEAD:${REF_NAME} --follow-tags
        env:
          REF_NAME: ${{ github.ref_name }}

      - name: Build
        run: npm run build

      - name: Check package contents
        run: npm pack --dry-run

      - name: Publish to npm
        run: npm publish --provenance --tag ${NPM_TAG}
        env:
          NPM_TAG: ${{ inputs.npm_tag }}

      - name: Create GitHub release
        id: create_release
        run: |
          tag_name="$(git describe --tags --abbrev=0)"

          options=()
          if [[ "${tag_name}" == *-* ]]; then
            options+=("--prerelease")
          fi

          gh release create "${tag_name}" --verify-tag --generate-notes "${options[@]}"
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Summary
        run: |
          echo "Published @sue445/rb-wasm-vdom@${VERSION} with npm dist-tag ${NPM_TAG}" >> "$GITHUB_STEP_SUMMARY"
        env:
          VERSION: ${{ steps.package_version.outputs.version }}
          NPM_TAG: ${{ inputs.npm_tag }}

      - name: Wait for npm registry propagation
        run: sleep 60

      - name: Purge jsDelivr cache
        run: curl -s https://purge.jsdelivr.net/npm/@sue445/rb-wasm-vdom@latest/dist/rb-wasm-vdom.rb
