<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>rb-wasm-vdom Example (using PicoRuby.wasm)</title>

  <script src="https://cdn.jsdelivr.net/npm/@picoruby/wasm-wasi@latest/dist/init.iife.js"></script>

  <script type="text/ruby" src="../dist/rb-wasm-vdom.rb"></script>

  <style>
    body { font-family: sans-serif; text-align: center; margin-top: 50px; }
    .board {
      display: grid;
      grid-template-columns: repeat(3, 80px);
      gap: 5px;
      justify-content: center;
      margin: 20px auto;
    }
    .cell {
      width: 80px;
      height: 80px;
      font-size: 36px;
      cursor: pointer;
      background-color: #f8f8f8;
      border: 1px solid #ccc;
    }
    .reset-btn {
      padding: 10px 20px;
      font-size: 16px;
      cursor: pointer;
      margin-top: 20px;
      background-color: #eee;
      border: 1px solid #999;
      border-radius: 4px;
    }
    .reset-btn:hover {
      background-color: #ddd;
    }
  </style>
</head>

<h1>rb-wasm-vdom Example (using PicoRuby.wasm)</h1>
